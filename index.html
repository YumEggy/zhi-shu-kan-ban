<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <title>指数看板公开版</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #e9f2f8;
        --surface: #ffffff;
        --text: #14202b;
        --dim: #64748b;
        --border: #dde6ee;
        --up: #d92c1f;
        --down: #00a870;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0d141b;
          --surface: #1a2632;
          --text: #eef4f8;
          --dim: #93a5b5;
          --border: #2a3947;
          --up: #ff6b5e;
          --down: #2fce9e;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; min-height: 36px; }
      main { max-width: 768px; margin: 0 auto; padding: 0 16px 40px; }
      .tnum { font-variant-numeric: tabular-nums; }

      /* status bar */
      .statusbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-top: 16px; }
      .status-left { display: flex; align-items: center; gap: 8px; min-width: 0; flex-wrap: wrap; }
      .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); flex: none; }
      .dot.live { background: var(--up); animation: pulse 1.6s ease-in-out infinite; }
      @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
      @media (prefers-reduced-motion: reduce) { .dot.live { animation: none; } }
      .status-title { font-size: 14px; font-weight: 600; }
      .status-time { font-size: 12px; color: var(--dim); }
      .refresh-btn { background: var(--surface); border-radius: 999px; padding: 6px 14px; font-size: 14px; font-weight: 500; box-shadow: 0 1px 3px rgba(20,32,43,.12); flex: none; }
      .refresh-btn:active { transform: scale(.95); }
      .refresh-btn:disabled { opacity: .6; }
      .notice { margin-top: 8px; font-size: 12px; line-height: 1.6; color: var(--dim); }
      .notice strong { color: var(--text); font-weight: 600; }

      /* featured */
      .featured {
        width: 100%; text-align: left; display: block;
        border-radius: 24px; padding: 20px; margin-top: 16px;
        box-shadow: 0 1px 3px rgba(20,32,43,.12);
      }
      .featured:active { transform: scale(.99); }
      .featured-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
      .featured-name { display: flex; align-items: center; gap: 8px; font-size: 18px; font-weight: 600; }
      .featured-state { font-size: 12px; opacity: .8; }
      .featured-main { margin-top: 8px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; }
      .featured-pct { font-size: 44px; font-weight: 700; line-height: 1; }
      .featured-price { font-size: 20px; font-weight: 500; }
      .featured-change { font-size: 14px; opacity: .85; }
      .featured-sub { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 13px; opacity: .85; }

      .chip { display: inline-block; border-radius: 4px; padding: 2px 6px; font-size: 11px; line-height: 16px; font-weight: 500; background: rgba(255,255,255,.25); color: #fff; }
      .chip.on-light { background: rgba(20,32,43,.06); color: var(--dim); font-weight: 400; }

      /* fund card */
      .fund-card { margin-top: 12px; background: var(--surface); border-radius: 24px; padding: 16px; box-shadow: 0 1px 3px rgba(20,32,43,.08); }
      .fund-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
      .fund-head h2 { margin: 0; font-size: 15px; font-weight: 600; }
      .fund-head span { font-size: 12px; color: var(--dim); }
      .fund-grid { margin-top: 12px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
      .fund-item { background: var(--bg); border-radius: 16px; padding: 12px 14px; }
      .fund-item .fname { font-size: 13px; color: var(--dim); }
      .fund-item .fnav { margin-top: 4px; display: flex; align-items: baseline; gap: 8px; }
      .fund-item .fnav b { font-size: 22px; font-weight: 600; }
      .fund-item .fchg { font-size: 14px; font-weight: 500; }
      .fund-item .fdate { margin-top: 2px; font-size: 12px; color: var(--dim); }

      /* index grid */
      section.grid-sec { margin-top: 24px; }
      section.grid-sec h2 { margin: 0 0 10px; font-size: 16px; font-weight: 600; }
      .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
      @media (min-width: 640px) { .grid { grid-template-columns: 1fr 1fr 1fr; } }
      .card {
        width: 100%; text-align: left; display: block;
        border-radius: 16px; padding: 14px; min-height: 44px;
        box-shadow: 0 1px 3px rgba(20,32,43,.10);
      }
      .card:active { transform: scale(.98); }
      .card.selected { outline: 2px solid var(--text); outline-offset: 2px; }
      .card-top { display: flex; align-items: center; gap: 6px; }
      .card-name { font-size: 15px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .card-pct { margin-top: 6px; font-size: 26px; font-weight: 600; line-height: 32px; }
      .card-price { font-size: 15px; opacity: .9; }

      /* detail */
      .detail { margin-top: 24px; background: var(--surface); border-radius: 24px; padding: 16px; box-shadow: 0 1px 3px rgba(20,32,43,.08); scroll-margin-top: 16px; }
      .detail-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; }
      .detail-title { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
      .detail-title h2 { margin: 0; font-size: 18px; font-weight: 600; }
      .detail-pct { font-size: 18px; font-weight: 600; }
      .detail-price { font-size: 14px; color: var(--dim); }
      .ranges { display: flex; flex-wrap: wrap; background: var(--bg); border-radius: 999px; padding: 2px; }
      .ranges button { border-radius: 999px; padding: 4px 10px; font-size: 13px; font-weight: 500; color: var(--dim); min-height: 32px; }
      .ranges button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: 0 1px 3px rgba(20,32,43,.15); }
      .chart-meta { margin: 12px 0 4px; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
      .chart-meta .rlabel { font-size: 14px; color: var(--dim); }
      .chart-meta .rpct { font-size: 14px; font-weight: 600; }
      .chart-readout { font-size: 12px; color: var(--dim); min-height: 16px; }
      .chart-wrap { position: relative; width: 100%; }
      .chart-wrap svg { display: block; width: 100%; height: auto; touch-action: pan-y; }
      .stats { margin-top: 12px; border-top: 1px solid var(--border); padding-top: 12px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px 16px; font-size: 14px; }
      @media (min-width: 640px) { .stats { grid-template-columns: repeat(4, 1fr); } }
      .stats dt { font-size: 12px; color: var(--dim); }
      .stats dd { margin: 2px 0 0; }
      .stats .sub { color: var(--dim); font-size: 12px; }

      footer { margin-top: 32px; text-align: center; font-size: 12px; line-height: 1.7; color: var(--dim); }
    </style>
  </head>
  <body>
    <main>
      <div class="statusbar">
        <div class="status-left">
          <span class="dot" id="statusDot"></span>
          <span class="status-title" id="statusTitle">快照数据</span>
          <span class="status-time tnum" id="statusTime"></span>
        </div>
        <button type="button" class="refresh-btn" id="refreshBtn" aria-label="刷新行情">刷新</button>
      </div>
      <p class="notice" id="snapshotNotice"></p>

      <section aria-label="创业板50 与联接基金">
        <button type="button" class="featured" id="featuredCard" aria-label="创业板50 详情"></button>
        <div class="fund-card">
          <div class="fund-head">
            <h2>我的联接基金</h2>
            <span>华安创业板50ETF联接 · 跟踪创业板50</span>
          </div>
          <div class="fund-grid" id="fundGrid"></div>
        </div>
      </section>

      <section class="grid-sec" aria-label="A股指数">
        <h2>A股</h2>
        <div class="grid" id="ashareGrid"></div>
      </section>

      <section class="grid-sec" aria-label="港股与美股指数">
        <h2>港股 · 美股</h2>
        <div class="grid" id="overseasGrid"></div>
      </section>

      <section class="detail" id="detailSection" aria-label="走势详情">
        <div class="detail-head">
          <div class="detail-title">
            <h2 id="detailName"></h2>
            <span class="detail-pct tnum" id="detailPct"></span>
            <span class="detail-price tnum" id="detailPrice"></span>
          </div>
          <div class="ranges" role="group" aria-label="走势图时间段" id="rangeGroup"></div>
        </div>
        <div class="chart-meta">
          <span class="rlabel" id="rangeLabel"></span>
          <span class="rpct tnum" id="rangePct"></span>
          <span class="chart-readout tnum" id="chartReadout"></span>
        </div>
        <div class="chart-wrap" id="chartWrap"></div>
        <dl class="stats">
          <div>
            <dt>今日高 / 低</dt>
            <dd class="tnum" id="statHighLow"></dd>
          </div>
          <div>
            <dt>市盈率 (PE)</dt>
            <dd class="tnum" id="statPe"></dd>
          </div>
          <div>
            <dt>估值水平</dt>
            <dd id="statVal"></dd>
          </div>
          <div>
            <dt>行情时间</dt>
            <dd class="tnum" id="statTime"></dd>
          </div>
        </dl>
      </section>

      <footer id="pageFooter"></footer>
    </main>

      function renderGrids() {

        state.order.forEach(function (k) {
          var q = state.quotes[k];
          if (q.key === "cyb50") return;
          if (q.group === "ashare") ashare += cardHtml(q); else overseas += cardHtml(q);
        });
        $("ashareGrid").innerHTML = ashare;
        $("overseasGrid").innerHTML = overseas;
        var cards = document.querySelectorAll(".card");
        for (var i = 0; i < cards.length; i++) {
          cards[i].addEventListener("click", function () { select(this.getAttribute("data-key"), true); });
        }
      }

      // ---------------- chart (hand-authored SVG polyline) ----------------
      function buildChart() {
        var hist = SNAPSHOT.history[state.selectedKey];
        var range = RANGES.filter(function (r) { return r.key === state.rangeKey; })[0] || RANGES[0];
        var readout = $("chartReadout");
        readout.textContent = "";
        if (!hist || hist.c.length < 2) {
          $("chartWrap").innerHTML = '<p style="padding:40px 0;text-align:center;font-size:14px;color:var(--dim)">走势数据暂时取不到。</p>';
          $("rangeLabel").textContent = range.label;
          $("rangePct").textContent = "";
          return;
        }
        var closes = hist.c.slice(-range.days);
        var dates = hist.d.slice(-range.days);
        var n = closes.length;
        var first = closes[0], last = closes[n - 1];
        var periodPct = first !== 0 ? (last - first) / first * 100 : null;
        var up = (periodPct || 0) >= 0;
        var color = up ? "#d92c1f" : "#00a870";
        $("rangeLabel").textContent = range.label;
        var rp = $("rangePct");
        rp.textContent = periodPct != null ? fmtPct(periodPct) : "";
        rp.style.color = color;

        var W = 720, H = 240, PL = 58, PR = 10, PT = 12, PB = 26;
        var min = Math.min.apply(null, closes), max = Math.max.apply(null, closes);
        var pad = (max - min) * 0.08 || max * 0.01 || 1;
        min -= pad; max += pad;
        function X(i) { return PL + (W - PL - PR) * (i / (n - 1)); }
        function Y(v) { return PT + (H - PT - PB) * (1 - (v - min) / (max - min)); }

        var parts = [];
        // gridlines + y labels (5 ticks)
        for (var t = 0; t <= 4; t++) {
          var v = min + (max - min) * t / 4;
          var y = Y(v);
          parts.push('<line x1="' + PL + '" y1="' + y.toFixed(1) + '" x2="' + (W - PR) + '" y2="' + y.toFixed(1) + '" stroke="var(--border)" stroke-width="1"/>');
          parts.push('<text x="' + (PL - 6) + '" y="' + (y + 4).toFixed(1) + '" text-anchor="end" font-size="11" fill="var(--dim)">' + v.toLocaleString("zh-CN", { maximumFractionDigits: 0 }) + "</text>");
        }
        // x labels: 4 evenly spaced dates
        var labelFmt = range.days > 250 ? function (d) { return d.slice(0, 7); } : function (d) { return d.slice(5); };
        for (var s = 0; s <= 3; s++) {
          var idx = Math.round((n - 1) * s / 3);
          var anchor = s === 0 ? "start" : (s === 3 ? "end" : "middle");
          parts.push('<text x="' + X(idx).toFixed(1) + '" y="' + (H - 6) + '" text-anchor="' + anchor + '" font-size="11" fill="var(--dim)">' + labelFmt(dates[idx]) + "</text>");
        }
        var pts = closes.map(function (c, i) { return X(i).toFixed(1) + "," + Y(c).toFixed(1); }).join(" ");
        parts.push('<polyline points="' + pts + '" fill="none" stroke="' + color + '" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>');
        parts.push('<circle id="hoverDot" r="4" fill="' + color + '" stroke="var(--surface)" stroke-width="2" style="display:none"/>');
        parts.push('<line id="hoverLine" y1="' + PT + '" y2="' + (H - PB) + '" stroke="' + color + '" stroke-width="1" stroke-dasharray="3 3" style="display:none"/>');
        parts.push('<rect id="hoverZone" x="' + PL + '" y="0" width="' + (W - PL - PR) + '" height="' + (H - PB) + '" fill="transparent"/>');
        $("chartWrap").innerHTML = '<svg viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="' + state.quotes[state.selectedKey].name + range.label + '走势折线图">' + parts.join("") + "</svg>";

        var svg = $("chartWrap").querySelector("svg");
        var zone = svg.querySelector("#hoverZone");
        var dot = svg.querySelector("#hoverDot");
        var line = svg.querySelector("#hoverLine");
        function onMove(evt) {
          var rect = svg.getBoundingClientRect();
          var clientX = evt.touches ? evt.touches[0].clientX : evt.clientX;
          var x = (clientX - rect.left) / rect.width * W;
          var i = Math.round((x - PL) / (W - PL - PR) * (n - 1));
          i = Math.max(0, Math.min(n - 1, i));
          dot.setAttribute("cx", X(i)); dot.setAttribute("cy", Y(closes[i])); dot.style.display = "";
          line.setAttribute("x1", X(i)); line.setAttribute("x2", X(i)); line.style.display = "";
          readout.textContent = dates[i] + " · 收盘 " + fmtPrice(closes[i]);
        }
        function onLeave() { dot.style.display = "none"; line.style.display = "none"; readout.textContent = ""; }
        zone.addEventListener("pointermove", onMove);
        zone.addEventListener("pointerdown", onMove);
        zone.addEventListener("pointerleave", onLeave);
      }

      function renderDetail() {
        var q = state.quotes[state.selectedKey];
        $("detailName").textContent = q.name;
        var pct = $("detailPct");
        pct.textContent = fmtPct(q.changePercent);
        pct.style.color = dirColor(q);
        $("detailPrice").textContent = fmtPrice(q.price);
        $("rangeGroup").innerHTML = RANGES.map(function (r) {
          return '<button type="button" data-range="' + r.key + '" aria-pressed="' + (state.rangeKey === r.key) + '">' + r.label.replace("近", "") + "</button>";
        }).join("");
        var btns = $("rangeGroup").querySelectorAll("button");
        for (var i = 0; i < btns.length; i++) {
          btns[i].addEventListener("click", function () {
            state.rangeKey = this.getAttribute("data-range");
            renderDetail();
          });
        }
        buildChart();
        $("statHighLow").textContent = fmtPrice(q.high) + " / " + fmtPrice(q.low);
        $("statPe").textContent = q.valuation ? q.valuation.pe.toFixed(1) : (q.pe != null ? q.pe.toFixed(1) : "--");
        if (q.valuation) {
          var srcNote = q.valuation.source === "wacai"
            ? " · PE 分位 " + (q.valuation.pePercentile * 100).toFixed(1) + "%（挖财基金）"
            : " · PE 处于近十年 " + (q.valuation.pePercentile * 100).toFixed(0) + "% 分位（蛋卷基金）";
          $("statVal").innerHTML = VAL_LABEL[q.valuation.type] + '<span class="sub">' + srcNote + "</span>";
        } else {
          $("statVal").innerHTML = '<span class="sub">暂无估值评级</span>';
        }
        $("statTime").innerHTML = (q.quoteLocal || "--") + ' <span class="sub">' + (q.marketOpen ? "交易中" : "已收盘") + "</span>";
      }

      function renderAll() {
        renderStatus();
        renderFeatured();
        renderFunds();
        renderGrids();
        renderDetail();
      }

      function select(key, scroll) {
        state.selectedKey = key;
        renderFeatured();
        renderGrids();
        renderDetail();
        if (scroll) $("detailSection").scrollIntoView({ behavior: "smooth", block: "start" });
      }
      $("featuredCard").addEventListener("click", function () { select("cyb50", true); });

      // ---------------- static notices ----------------
      $("snapshotNotice").innerHTML =
        "<strong>静态公开版</strong>：为在微信里打开而生成。行情打开时自动更新，页面开着时每分钟刷新一次，更新方式已针对微信调整；" +
        "万一网络更新失败，显示的是 <strong>" + SNAPSHOT.snapshotLabel + "</strong> 的快照数据，点右上角「刷新」可再试。" +
        "走势图与估值标签为快照（截至 " + SNAPSHOT.snapshotLabel + "），估值标签有变化时，告诉 miumiu 重新生成即可更新这一版。";
      $("pageFooter").innerHTML =
        "实时行情：腾讯财经 · 快照行情：腾讯财经（" + SNAPSHOT.snapshotLabel + "）· 走势：东方财富日线<br/>" +
        "估值分位：蛋卷基金、挖财基金（2026-11-16）· 基金净值为 2026-11-17 官方净值，盘中申购按当日收盘后净值确认<br/>" +
        "公开数据源口径与支付宝指数+略有差异";

      // ---------------- live refresh via script tags ----------------
      // WeChat's built-in browser blocks cross-origin fetch/XHR, so live data
      // is loaded as classic <script> tags instead — script loads are not
      // subject to CORS. Tencent's quote endpoint answers with
      // v_<symbol>="..." variable assignments; Eastmoney's fundgz endpoint
      // calls a global jsonpgz() callback. Valuations stay at the snapshot
      // values (they only change daily and are refreshed on regeneration).
      function numOrNull(s) {
        if (s == null || s === "") return null;
        var n = Number(s);
        return isFinite(n) ? n : null;
      }
      function loadScript(url, ms) {
        return new Promise(function (resolve, reject) {
          var s = document.createElement("script");
          var settled = false;
          var timer = setTimeout(function () { finish(new Error("timeout")); }, ms || 12000);
          function finish(err) {
            if (settled) return;
            settled = true;
            clearTimeout(timer);
            if (s.parentNode) s.parentNode.removeChild(s);
            if (err) reject(err); else resolve();
          }
          s.onload = function () { finish(null); };
          s.onerror = function () { finish(new Error("load error")); };
          s.async = true;
          s.charset = "gbk";
          s.src = url;
          document.head.appendChild(s);
        });
      }
      function parseTencentString(raw) {
        var f = String(raw).split("~");
        var tsIdx = -1;
        for (var i = 3; i < f.length; i++) {
          if (/^\d{14}$/.test(f[i]) || /^\d{4}[-/]\d{2}[-/]\d{2}[ ]\d{2}:\d{2}/.test(f[i])) { tsIdx = i; break; }
        }
        if (tsIdx < 0) return null;
        var tsRaw = f[tsIdx], quoteLocal = null;
        var c = /^(\d{4})(\d{2})(\d{2})(\d{2})(\d{2})/.exec(tsRaw);
        if (c) quoteLocal = c[1] + "-" + c[2] + "-" + c[3] + " " + c[4] + ":" + c[5];
        else {
          var m = /^(\d{4})[-/](\d{1,2})[-/](\d{1,2})[ ](\d{1,2}):(\d{2})/.exec(tsRaw);
          if (m) quoteLocal = m[1] + "-" + ("0" + m[2]).slice(-2) + "-" + ("0" + m[3]).slice(-2) + " " + ("0" + m[4]).slice(-2) + ":" + m[5];
        }
        var pe = numOrNull(f[39]);
        return {
          price: numOrNull(f[3]),
          change: numOrNull(f[tsIdx + 1]),
          changePercent: numOrNull(f[tsIdx + 2]),
          high: numOrNull(f[tsIdx + 3]),
          low: numOrNull(f[tsIdx + 4]),
          pe: pe != null && pe > 0 && pe < 1000 ? pe : null,
          quoteLocal: quoteLocal
        };
      }
      function shanghaiNow() {
        return new Date(new Date().toLocaleString("en-US", { timeZone: "Asia/Shanghai" }));
      }
      function ashareOpen(quoteLocal) {
        if (!quoteLocal) return false;
        var now = shanghaiNow();
        var today = now.getFullYear() + "-" + ("0" + (now.getMonth() + 1)).slice(-2) + "-" + ("0" + now.getDate()).slice(-2);
        if (quoteLocal.slice(0, 10) !== today) return false;
        var day = now.getDay();
        if (day === 0 || day === 6) return false;
        var mins = now.getHours() * 60 + now.getMinutes();
        return (mins >= 570 && mins < 690) || (mins >= 780 && mins < 900);
      }
      function tryRefreshQuotes() {
        var symbols = Object.keys(TENCENT_SYMBOL).map(function (k) { return TENCENT_SYMBOL[k]; }).join(",");
        return loadScript("https://qt.gtimg.cn/q=" + symbols + "&_=" + Date.now(), 12000)
          .then(function () {
            var updated = 0;
            Object.keys(TENCENT_SYMBOL).forEach(function (k) {
              var raw = window["v_" + TENCENT_SYMBOL[k]];
              if (typeof raw !== "string" || !raw) return;
              var p = parseTencentString(raw);
              var q = state.quotes[k];
              if (!q || !p || p.price == null) return;
              q.price = p.price; q.change = p.change; q.changePercent = p.changePercent;
              q.high = p.high; q.low = p.low;
              if (p.pe != null) q.pe = p.pe;
              if (p.quoteLocal) q.quoteLocal = p.quoteLocal;
              q.marketOpen = q.group === "ashare" ? ashareOpen(p.quoteLocal) : (q.group === "hk" ? ashareOpen(p.quoteLocal) : false);
              updated++;
            });
            if (updated === 0) throw new Error("empty");
            return true;
          });
      }
      function loadFundGz(f) {
        // fundgz answers by calling the global jsonpgz() once; loads are
        // chained by tryRefreshFunds so the single callback never races.
        return new Promise(function (resolve) {
          var settled = false;
          var prev = window.jsonpgz;
          var timer = setTimeout(done, 12000);
          function done() {
            if (settled) return;
            settled = true;
            clearTimeout(timer);
            if (typeof prev === "function") window.jsonpgz = prev;
            else { try { delete window.jsonpgz; } catch (e) { window.jsonpgz = undefined; } }
            resolve();
          }
          window.jsonpgz = function (data) {
            try {
              if (data && data.fundcode === f.code) {
                var nav = numOrNull(data.dwjz);
                if (nav != null) {
                  if (data.jzrq && data.jzrq !== f.navDate) f.changePercent = null;
                  f.nav = nav;
                }
                if (data.jzrq) f.navDate = data.jzrq;
              }
            } catch (e) {}
            done();
          };
          loadScript("https://fundgz.1234567.com.cn/js/" + f.code + ".js?_=" + Date.now(), 12000).then(done, done);
        });
      }
      function tryRefreshFunds() {
        var chain = Promise.resolve();
        state.funds.forEach(function (f) {
          chain = chain.then(function () { return loadFundGz(f); });
        });
        return chain.then(function () { return true; });
      }
      var refreshing = false;
      function refresh(manual) {
        if (refreshing) return;
        refreshing = true;
        var btn = $("refreshBtn");
        btn.disabled = true;
        btn.textContent = "刷新中…";
        var results = [false, false];
        var done = function () {
          refreshing = false;
          btn.disabled = false;
          btn.textContent = "刷新";
          if (results[0]) {
            state.live = true;
            var now = new Date();
            state.liveAt = ("0" + now.getHours()).slice(-2) + ":" + ("0" + now.getMinutes()).slice(-2) + ":" + ("0" + now.getSeconds()).slice(-2);
          }
          renderAll();
          if (manual && !results[0]) {
            $("statusTime").textContent = "更新未成功，仍为 " + SNAPSHOT.snapshotLabel + " 快照";
          }
        };
        Promise.all([
          tryRefreshQuotes().then(function (v) { results[0] = v; }, function () {}),
          tryRefreshFunds().then(function (v) { results[1] = v; }, function () {})
        ]).then(done, done);
      }
      $("refreshBtn").addEventListener("click", function () { refresh(true); });

      renderAll();
      refresh(false);
      setInterval(function () { refresh(false); }, 60000);
    </script>
  </body>
</html>
